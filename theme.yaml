apiVersion: theme.halo.run/v1alpha1
kind: Theme
metadata:
  name: theme-stellar
spec:
  customTemplates:
    page:
      - name: 专题分类模板
        description:
        screenshot:
        file: category_topic.html
    post:
      - name: 专题模板
        description:
        screenshot:
        file: topic.html
  displayName: Stellar-LTS
  author:
    name: bi1kbu
    website: "https://github.com/bi1kbu"
