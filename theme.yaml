  logo: "/themes/theme-stellar/assets/img/icon.svg"
  homepage: "https://github.com/bi1kbu/halo-theme-stellar"
  repo: "https://github.com/bi1kbu/halo-theme-stellar"
  issues: "https://github.com/bi1kbu/halo-theme-stellar/issues"
  settingName: "theme-stellar-setting"
  configMapName: "theme-stellar-configMap"
  version: "1.1.3"
